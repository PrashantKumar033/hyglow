                $ref: "#/components/schemas/LedgerEntry"

  /ledger/{id}:
    get:
      operationId: getLedgerEntry
      tags: [accounting]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
