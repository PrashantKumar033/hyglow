kind = "web"
previewPath = "/"
title = "Hyglow ERP"
version = "1.0.0"
id = "artifacts/hyglow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25129

[services.development]
run = "pnpm --filter @workspace/hyglow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hyglow", "run", "build" ]
publicDir = "artifacts/hyglow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25129"
BASE_PATH = "/"
